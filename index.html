<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>MiPrograma</title>
</head>

<div class="container">

    <div>
        <h1>COMPARADOR DE NÚMEROS</h1>
    </div>

    <div>
        <span>Ingresa el primer número:</span>
        <input type="number" id="number1">
    </div>

    <div>
        <span>Ingresa el segundo número:</span>
        <input type="number" id="number2">
    </div>

    <div>
        <span>Ingresa el tercer número:</span>
        <input type="number" id="number3">
    </div>

    <div>
        <button id="compareButton">Comparar números</button>
    </div>
    <div id="results">
        <h1>RESULTADOS</h1>

        <h4>Números ordenados de mayor a menor:</h4>
        <p id="descending"></p>

        <h4>Números ordenados de menor a mayor:</h4>
        <p id="ascending"></p>

        <p id="message"></p>
    </div>

</div>
<script src="script.js"></script>
</html>
